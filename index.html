<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>CapCut Pro — Video Editor</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --panel2:#1d2029; --line:#2a2e3a;
    --txt:#e7e9ee; --muted:#8b90a0; --accent:#ff2d55; --accent2:#3b82f6;
    --ok:#22c55e; --warn:#f59e0b; --clip:#2b3550; --clipimg:#3a2f4d; --cliptxt:#1f4a3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px; overflow:hidden; user-select:none;}
  button{font-family:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px;transition:.12s;}
  button:hover{background:#262a36;border-color:#3a4150;}
  button:active{transform:scale(.97);}
  button.primary{background:var(--accent);border-color:var(--accent);}
  button.primary:hover{background:#ff4d6e;}
  button.ghost{background:transparent;}
  input,select,textarea{font-family:inherit;color:var(--txt);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;width:100%;}
  input[type=range]{padding:0;height:22px;background:transparent;width:100%;}
  input[type=color]{padding:2px;height:30px;width:46px;}
  label{color:var(--muted);font-size:11px;display:block;margin:8px 0 3px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .row.end{justify-content:flex-end;}
  .spacer{flex:1;}
  .iconbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;}
  .hidden{display:none !important;}

  /* Layout */
  #app{display:grid;grid-template-rows:48px 1fr 220px;grid-template-columns:100%;height:100vh;width:100vw;}
  #topbar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  #topbar .logo{font-weight:700;letter-spacing:.5px;color:var(--accent);font-size:15px;margin-right:6px;}
  #topbar .logo span{color:var(--txt);}
  #mid{display:grid;grid-template-columns:210px 1fr 240px;min-height:0;}
  #mediaBin{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  #stage{display:flex;flex-direction:column;min-width:0;background:#0a0b0e;}
  #props{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto;}
  #timeline{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}

  /* Media bin */
  .bin-head{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;}
  .bin-list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .bin-item{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:7px;cursor:pointer;}
  .bin-item:hover{border-color:#3a4150;}
  .bin-thumb{width:46px;height:46px;border-radius:6px;background:#000;object-fit:cover;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);overflow:hidden;}
  .bin-thumb video,.bin-thumb img{width:100%;height:100%;object-fit:cover;}
  .bin-meta{min-width:0;flex:1;}
  .bin-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bin-sub{font-size:10px;color:var(--muted);}
  .bin-tip{font-size:10px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);line-height:1.4;}

  /* Stage / preview */
  #stage .toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;}
  #canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:10px;}
  #preview{background:#000;max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .stage-foot{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;}

  /* Properties */
  .props-head{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;}
  .props-body{padding:10px 12px;flex:1;}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{border:0;border-radius:0;flex:1;border-right:1px solid var(--line);background:var(--panel2);}
  .seg button:last-child{border-right:0;}
  .seg button.on{background:var(--accent2);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .empty-hint{color:var(--muted);font-size:12px;line-height:1.6;padding:20px 10px;text-align:center;}
  .subhead{margin:14px 0 2px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent2);border-top:1px solid var(--line);padding-top:10px;}
  .tts-status{margin-top:6px;font-size:11px;color:var(--ok);}
  label.row{display:flex;align-items:center;gap:6px;}

  /* Timeline */
  .tl-head{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);}
  .tl-ruler{position:relative;height:26px;background:var(--panel2);border-bottom:1px solid var(--line);
    margin-left:74px;overflow:hidden;cursor:pointer;flex:none;}
  .tl-ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2f3442;font-size:9px;color:var(--muted);padding-left:3px;line-height:26px;}
  .tl-body{flex:1;overflow:auto;position:relative;}
  .tl-tracks{position:relative;}
  .track{display:flex;height:46px;border-bottom:1px solid var(--line);}
  .track-label{width:74px;flex:none;background:var(--panel2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted);position:sticky;left:0;z-index:3;}
  .track-label .ttl{font-size:11px;color:var(--txt);font-weight:600;}
  .track-lane{flex:1;position:relative;background:
    repeating-linear-gradient(90deg,#12141a,#12141a 9px,#15171f 9px,#15171f 10px);}
  .clip{position:absolute;top:3px;height:40px;border-radius:7px;padding:4px 6px;overflow:hidden;cursor:grab;
    border:1px solid rgba(255,255,255,.12);font-size:10px;color:#fff;display:flex;flex-direction:column;min-width:14px;}
  .clip.sel{border:2px solid #fff;box-shadow:0 0 0 1px var(--accent);}
  .clip.video{background:linear-gradient(180deg,#3b5bdb,#2b3f9e);}
  .clip.image{background:linear-gradient(180deg,#7048e8,#4c2f9e);}
  .clip.text{background:linear-gradient(180deg,#0ca678,#08705a);}
  .clip.audio{background:linear-gradient(180deg,#e8590c,#a8400a);}
  .clip .ct{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .clip .cs{opacity:.7;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .clip .chandle{position:absolute;top:0;height:100%;width:7px;background:rgba(255,255,255,.25);cursor:ew-resize;}
  .clip .chandle.l{left:0;border-radius:7px 0 0 7px;}
  .clip .chandle.r{right:0;border-radius:0 7px 7px 0;}
  .playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:6;pointer-events:none;left:74px;}
  .playhead::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:12px;background:var(--accent);
    border-radius:0 0 6px 6px;clip-path:polygon(0 0,100% 0,50% 100%);}
  .snap-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent2);z-index:7;pointer-events:none;}
  .zoombar{display:flex;align-items:center;gap:6px;}

  /* transport */
  .transport{display:flex;align-items:center;gap:8px;}
  .bigplay{width:40px;height:40px;border-radius:50%;background:var(--accent);border:0;font-size:18px;display:flex;align-items:center;justify-content:center;color:#fff;}
  .bigplay:hover{background:#ff4d6e;}

  /* Modal / toast */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;
    padding:10px 16px;border-radius:10px;border:1px solid var(--line);z-index:200;opacity:0;transition:.2s;pointer-events:none;}
  #toast.show{opacity:1;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,92vw);}
  .modal h3{margin:0 0 14px;}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
  .kbd{background:#000;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--muted);}

  /* export progress */
  #exportModal .bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px;}
  #exportModal .fill{height:100%;width:0;background:var(--ok);transition:.2s;}

  @media (max-width:760px){
    #mid{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;}
    #mediaBin{order:1;max-height:120px;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow:auto;}
    #mediaBin .bin-head,#mediaBin .bin-tip{display:none;}
    #mediaBin .bin-list{flex-direction:row;overflow-x:auto;width:100%;}
    #mediaBin .bin-item{width:140px;flex:none;}
    #props{order:3;max-height:200px;border-left:0;border-top:1px solid var(--line);}
    #stage{order:2;}
    #app{grid-template-rows:48px 1fr 200px;}
    .track-label{width:54px;}
    .tl-ruler{margin-left:54px;}
    .playhead{left:54px;}
  }
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">Cap<span>Cut</span> Pro</div>
    <button class="ghost" id="btnImportVideo">+ Video</button>
    <button class="ghost" id="btnImportImage">+ Image</button>
    <button class="ghost" id="btnImportAudio">+ Audio</button>
    <button class="ghost" id="btnAddText">+ Text</button>
    <button class="ghost" id="btnAddTTS">+ Voice</button>
    <div class="spacer"></div>
    <button class="ghost" id="btnSave">Save</button>
    <button class="ghost" id="btnLoad">Open</button>
    <button class="ghost" id="btnUndo">Undo</button>
    <button class="primary" id="btnExport">Export</button>
    <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple class="hidden">
  </div>

  <!-- MID -->
  <div id="mid">
    <!-- MEDIA BIN -->
    <div id="mediaBin">
      <div class="bin-head">Media</div>
      <div class="bin-list" id="binList"></div>
      <div class="bin-tip">Click a clip to add to timeline. Drag on timeline to move • drag edges to trim • double‑click to split.</div>
    </div>

    <!-- STAGE -->
    <div id="stage">
      <div class="toolbar">
        <div class="zoombar">
          <button class="ghost iconbtn" id="btnZoomOut">−</button>
          <span class="time" id="zoomLbl">px/s</span>
          <button class="ghost iconbtn" id="btnZoomIn">+</button>
        </div>
        <div class="spacer"></div>
        <button class="ghost" id="btnFit">Fit</button>
        <button class="ghost" id="btnSnap">Snap: On</button>
      </div>
      <div id="canvasWrap"><canvas id="preview" width="960" height="540"></canvas></div>
      <div class="stage-foot">
        <div class="transport">
          <button class="bigplay" id="btnPlay">▶</button>
          <button class="ghost iconbtn" id="btnStart">⏮</button>
        </div>
        <span class="time" id="curTime">0:00.0</span>
        <input type="range" id="seek" min="0" max="1000" value="0" style="flex:1">
        <span class="time" id="durTime">0:00.0</span>
        <button class="ghost iconbtn" id="btnMute">🔊</button>
      </div>
    </div>

    <!-- PROPERTIES -->
    <div id="props">
      <div class="props-head"><span id="propsTitle">Properties</span></div>
      <div class="props-body" id="propsBody">
        <div class="empty-hint">Select a clip on the timeline to edit it, or add media from the left.</div>
      </div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline">
    <div class="tl-head">
      <strong style="font-size:12px">Timeline</strong>
      <button class="ghost" id="btnSplit">Split ✂</button>
      <button class="ghost" id="btnDel">Delete</button>
      <button class="ghost" id="btnCopy">Duplicate</button>
      <div class="spacer"></div>
      <span class="time" id="tlInfo"></span>
    </div>
    <div class="tl-ruler" id="ruler"><div class="playhead" id="playhead"></div><div class="snap-line hidden" id="snapLine"></div></div>
    <div class="tl-body" id="tlBody">
      <div class="tl-tracks" id="tracks"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Export modal -->
<div class="modal hidden" id="exportModal">
  <div class="box">
    <h3>Export Video</h3>
    <label>Resolution</label>
    <select id="expRes">
      <option value="960x540">540p (960×540)</option>
      <option value="1280x720" selected>720p (1280×720)</option>
      <option value="1920x1080">1080p (1920×1080)</option>
    </select>
    <label>FPS</label>
    <select id="expFps"><option>24</option><option selected>30</option><option>60</option></select>
    <label>Quality</label>
    <input type="range" id="expQ" min="1" max="40" value="18">
    <div class="bar"><div class="fill" id="expFill"></div></div>
    <div class="actions">
      <button class="ghost" id="expCancel">Cancel</button>
      <button class="primary" id="expStart">Start Render</button>
    </div>
  </div>
</div>

<!-- Text editor modal -->
<div class="modal hidden" id="textModal">
  <div class="box">
    <h3>Edit Text</h3>
    <textarea id="textInput" rows="3" style="width:100%"></textarea>
    <div class="actions">
      <button class="ghost" id="textCancel">Cancel</button>
      <button class="primary" id="textOk">OK</button>
    </div>
  </div>
</div>

<script src="vendor/mespeak.js"></script>
<script>
"use strict";
/* ============================================================
   CapCut Pro — single-file offline video editor
   Pure-logic core + DOM/render layer.
   ============================================================ */

/* ---------- PURE HELPERS (testable, no DOM) ---------- */
const Filters = {
  none:{name:'None',css:''},
  bw:{name:'B&W',css:'grayscale(1) contrast(1.05)'},
  warm:{name:'Warm',css:'sepia(.35) saturate(1.2) brightness(1.05)'},
  cool:{name:'Cool',css:'hue-rotate(-15deg) saturate(1.1) brightness(1.03)'},
  vivid:{name:'Vivid',css:'saturate(1.6) contrast(1.1)'},
  fade:{name:'Fade',css:'brightness(1.12) contrast(.92) saturate(.85)'},
  cinematic:{name:'Cinematic',css:'contrast(1.2) saturate(.85) brightness(.95) sepia(.12)'},
  vintage:{name:'Vintage',css:'sepia(.5) contrast(.9) brightness(1.05) saturate(.8)'},
  invert:{name:'Invert',css:'invert(1)'},
  blur:{name:'Blur',css:'blur(3px)'}
};
const Animations = {
  none:{name:'None',fn:null},
  fade:{name:'Fade In',fn:(t,d)=>Math.min(1,t/0.4)},
  pop:{name:'Pop',fn:(t,d)=>{const k=Math.min(1,t/0.3);return 1+(1-k)*0.6;}},
  slide:{name:'Slide',fn:(t,d)=>Math.min(1,t/0.4)},
  type:{name:'Typewriter',fn:(t,d)=>Math.min(1,t/Math.max(.2,d))}
};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function fmt(sec){
  sec=Math.max(0,sec||0);
  const m=Math.floor(sec/60), s=Math.floor(sec%60), d=Math.floor((sec*10)%10);
  return m+':'+String(s).padStart(2,'0')+'.'+d;
}
// effective on-screen duration of a clip given its trim + speed
function effDur(c){
  if(c.kind==='text') return Math.max(0, c.dur||0);
  const inner = Math.max(0, (c.dur||0) - ((c.trimStart||0)+(c.trimEnd||0)));
  return inner / (c.speed||1);
}
function snapVal(x, candidates, threshold){
  if(!state.snap) return x;
  let best=x, bestD=threshold;
  for(const c of candidates){
    const d=Math.abs(c-x);
    if(d<bestD){bestD=d;best=c;}
  }
  return best;
}
function allSnapPoints(){
  const pts=[0];
  for(const t of state.tracks) for(const c of t.clips){
    pts.push(c.start); pts.push(c.start+effDur(c));
  }
  return pts;
}

/* ---------- STATE ---------- */
const state = {
  tracks:[],          // [{id,kind,name,clips:[...]}]
  media:[],           // imported assets
  sel:null,           // selected clip {trackId,clipId}
  playhead:0,
  playing:false,
  pixelsPerSec:120,
  snap:true,
  muted:false,
  projectName:'Untitled',
  _t0:0, _clockOffset:0
};
// ensure default tracks
function ensureTracks(){
  const needed=['video','image','text','audio','tts'];
  for(const k of needed){
    if(!state.tracks.find(t=>t.kind===k)){
      state.tracks.push({id:uid(),kind:k,name:{video:'Video',image:'Image',text:'Text',audio:'Audio',tts:'Voice'}[k],clips:[]});
    }
  }
}
ensureTracks();

/* ---------- MEDIA IMPORT ---------- */
const fileInput=document.getElementById('fileInput');
document.getElementById('btnImportVideo').onclick=()=>{fileInput.accept='video/*';fileInput.click();};
document.getElementById('btnImportImage').onclick=()=>{fileInput.accept='image/*';fileInput.click();};
document.getElementById('btnImportAudio').onclick=()=>{fileInput.accept='audio/*';fileInput.click();};
fileInput.onchange=e=>{
  const files=[...e.target.files];
  for(const f of files) importFile(f);
  fileInput.value='';
};
async function importFile(f){
  const url=URL.createObjectURL(f);
  const kind=f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':'image';
  const m={id:uid(),name:f.name,url,kind,type:f.type,dur:0,w:0,h:0,thumb:null};
  if(kind==='video'){
    await new Promise(res=>{
      const v=document.createElement('video');
      v.preload='metadata';v.muted=true;v.src=url;
      v.onloadedmetadata=()=>{m.dur=v.duration;m.w=v.videoWidth;m.h=v.videoHeight;
        const c=document.createElement('canvas');c.width=120;c.height=Math.round(120*(m.h/m.w||9/16));
        const cx=c.getContext('2d');v.currentTime=Math.min(1,m.dur/2);
        v.onseeked=()=>{try{cx.drawImage(v,0,0,c.width,c.height);m.thumb=c.toDataURL('image/jpeg',.6);}catch(e){}res();};
        setTimeout(res,2500);};
      v.onerror=()=>res();
    });
  } else if(kind==='image'){
    await new Promise(res=>{const im=new Image();im.onload=()=>{m.w=im.naturalWidth;m.h=im.naturalHeight;m.dur=5;res();};im.onerror=res;im.src=url;});
  } else if(kind==='audio'){
    await new Promise(res=>{const a=new Audio();a.preload='metadata';a.src=url;
      a.onloadedmetadata=()=>{m.dur=a.duration;res();};a.onerror=res;a.load();});
  }
  state.media.push(m);
  renderBin();
  toast('Imported '+m.name);
}
function mediaById(id){return state.media.find(m=>m.id===id);}

/* ---------- ADD CLIP TO TIMELINE ---------- */
function addMediaClip(mediaId){
  const m=mediaById(mediaId); if(!m) return;
  const trackKind = m.kind==='audio'?'audio':(m.kind==='image'?'image':'video');
  const track=state.tracks.find(t=>t.kind===trackKind);
  const dur = m.kind==='image'? Math.max(2,m.dur||5) : (m.dur||5);
  const clip={id:uid(),mediaId:mediaId,kind:m.kind==='audio'?'audio':(m.kind==='image'?'image':'video'),
    start:freeStart(track),dur,srcDur:m.dur||dur,trimStart:0,trimEnd:0,speed:1,
    volume:1,filter:'none',fit:'cover',x:0,y:0,scale:1,rotate:0,
    text:'',textStyle:null,anim:'none',animDur:0.4,opacity:1};
  track.clips.push(clip);
  selectClip(track.id,clip.id);
  renderTimeline();
}
function freeStart(track){
  // place at end of track or after playhead, whichever later
  let end=0; for(const c of track.clips) end=Math.max(end,c.start+effDur(c));
  return Math.max(end, state.playhead);
}
function addTextClip(){
  const track=state.tracks.find(t=>t.kind==='text');
  const clip={id:uid(),mediaId:null,kind:'text',start:Math.max(0,state.playhead),dur:3,srcDur:3,
    trimStart:0,trimEnd:0,speed:1,volume:1,filter:'none',fit:'cover',x:0,y:0,scale:1,rotate:0,
    text:'Double tap to edit',textStyle:{font:'700 64px Arial',color:'#ffffff',align:'center',
      bg:'rgba(0,0,0,0)',stroke:'#000000',strokeW:0,padding:14,shadow:8},
    anim:'fade',animDur:0.4,opacity:1};
  track.clips.push(clip);
  selectClip(track.id,clip.id);
  renderTimeline();
}
document.getElementById('btnAddText').onclick=addTextClip;

/* ---------- TEXT-TO-SPEECH VOICEOVER (offline meSpeak, exportable) ---------- */
// meSpeak is loaded from vendor/mespeak.js (bundled, ~5.5MB, includes English voice).
// It returns a BASE64 WAV via rawdata:'base64' — that audio can be mixed into the export.
const TTS_VOICES=[
  {id:'en',label:'English (default)',variant:'',pitch:50,speed:175,gender:'m'},
  {id:'en-us',label:'English US',variant:'en-us',pitch:50,speed:175,gender:'m'},
  {id:'en-rp',label:'English RP (UK)',variant:'en-rp',pitch:50,speed:175,gender:'m'},

let ttsReady=false, ttsLoading=false;

// decode a base64 WAV (RIFF) into a Web Audio AudioBuffer for mixing
function base64WavToAudioBuffer(ac,wavB64){
  const bin=atob(wavB64);
  const len=bin.length;
  const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  let off=12, dataOff=-1, dataLen=0, sampleRate=44100, numCh=1, bits=16;
  const dv=new DataView(bytes.buffer);
  while(off+8<=bytes.length){
    const chunk=String.fromCharCode(bytes[off],bytes[off+1],bytes[off+2],bytes[off+3]);
    const size=dv.getUint32(off+4,true);
    if(chunk==='fmt '){ numCh=dv.getUint16(off+10,true); sampleRate=dv.getUint32(off+12,true); bits=dv.getUint16(off+22,true); }
    else if(chunk==='data'){ dataOff=off+8; dataLen=size; break; }
    off+=8+size;
  }
  if(dataOff<0) return null;
  const samples=dataLen/(bits/8);
  const buf=ac.createBuffer(numCh, samples, sampleRate);
  if(bits===16){
    const s16=new Int16Array(bytes.buffer, dataOff, samples*numCh);
    for(let ch=0;ch<numCh;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<samples;i++) d[i]=s16[i*numCh+ch]/32768; }
  } else if(bits===8){
    const u8=new Uint8Array(bytes.buffer, dataOff, samples*numCh);
    for(let ch=0;ch<numCh;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<samples;i++) d[i]=(u8[i*numCh+ch]-128)/128; }
  } else return null;
  return buf;
}
function wavDurationSec(wavB64){
  try{
    const bin=atob(wavB64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const u=new DataView(bytes.buffer); let off=12, dataLen=0, sr=44100, bits=16, ch=1;
    while(off+8<=bytes.length){const chunk=String.fromCharCode(bytes[off],bytes[off+1],bytes[off+2],bytes[off+3]);const size=u.getUint32(off+4,true);
      if(chunk==='fmt '){ch=u.getUint16(off+10,true);sr=u.getUint32(off+12,true);bits=u.getUint16(off+22,true);} else if(chunk==='data'){dataLen=size;break;} off+=8+size;}
    return dataLen/((bits/8)*sr*ch);
  }catch(e){ return 3; }
}

function synthesizeTTS(clip){

let ttsPreviewCtx=null;
function previewTTS(clip){
  if(!clip.wav||state.muted) return;

    const AC=window.AudioContext||window.webkitAudioContext;
    if(!ttsPreviewCtx) ttsPreviewCtx=new AC();
    const ab=base64WavToAudioBuffer(ttsPreviewCtx, clip.wav);
    if(!ab) return;
    const src=ttsPreviewCtx.createBufferSource(); src.buffer=ab;
    const g=ttsPreviewCtx.createGain(); g.gain.value=clip.volume??1;
    src.connect(g); g.connect(ttsPreviewCtx.destination);

  }catch(e){ console.warn('tts preview fail',e); }
}
let audioCtxMix=null, ttsLive={};
function tickTTS(t){

    if(t>=c.start && t<c.start+effDur(c)){
      const node=ttsLive[c.id];
      if(!node||!node.started){
        if(c.wav){
          try{
            const ab=base64WavToAudioBuffer(audioCtxMix, c.wav);
            const src=audioCtxMix.createBufferSource(); src.buffer=ab;
            const g=audioCtxMix.createGain(); g.gain.value=state.muted?0:(c.volume??1);
            src.connect(g); g.connect(audioCtxMix.destination);
            src.start(audioCtxMix.currentTime, (t-c.start)*c.speed);

/* ---------- DRAG / TRIM ---------- */
let drag=null;
function onClipDown(e,track,clip){
  e.preventDefault();e.stopPropagation();
  selectClip(track.id,clip.id);
  const handle=e.target.classList.contains('chandle')?(e.target.classList.contains('l')?'l':'r'):null;
  const startX=(e.touches?e.touches[0].clientX:e.clientX);
  drag={track,clip,handle,startX,origStart:clip.start,origDur:clip.dur,
    origTrimS:clip.trimStart,origTrimE:clip.trimEnd,pps:state.pixelsPerSec,moved:false};
  window.addEventListener('mousemove',onDragMove);
  window.addEventListener('mouseup',onDragUp);
  window.addEventListener('touchmove',onDragMove,{passive:false});
  window.addEventListener('touchend',onDragUp);
}
function onDragMove(e){
  if(!drag) return;
  e.preventDefault();
  const x=(e.touches?e.touches[0].clientX:e.clientX);
  const dx=(x-drag.startX)/drag.pps;
  if(!drag.handle){
    let ns=drag.origStart+dx;
    ns=Math.max(0,snapVal(ns,allSnapPoints(),8/drag.pps));
    ns=Math.max(0,ns);
    drag.clip.start=ns;
    if(Math.abs(dx)>0.02) drag.moved=true;
  } else if(drag.handle==='l'){
    // trim start: move start, adjust trimStart
    let ns=drag.origStart+dx;
    ns=Math.max(0,ns);
    let maxStart=drag.origStart+drag.origDur-0.1;
    ns=Math.min(ns,maxStart);
    const newStart=snapVal(ns,allSnapPoints(),8/drag.pps);
    const delta=newStart-drag.origStart;
    const trimS=clamp(drag.origTrimS+delta,drag.origTrimS- (drag.origStart), drag.origDur-0.1);
    drag.clip.trimStart=clamp(drag.origTrimS+ (newStart-drag.origStart), 0, drag.origDur-0.1);
    drag.clip.start=newStart;
    drag.moved=true;
  } else if(drag.handle==='r'){
    // trim end
    let nd=drag.origDur+dx;
    nd=Math.max(0.1,nd);
    nd=Math.min(nd,(drag.origDur+drag.origTrimE));
    drag.clip.dur=nd;
    drag.moved=true;
  }

}
function onDragUp(){
  if(drag&&drag.moved) renderTimeline();

}

function splitAtClip(clip){

/* ---------- PLAYBACK ---------- */
const canvas=document.getElementById('preview');

function play(){

function pause(){

function togglePlay(){state.playing?pause():play();}
document.getElementById('btnPlay').onclick=togglePlay;
document.getElementById('btnStart').onclick=()=>{pause();setPlayhead(0);renderFrame(0);};

function clockNow(){
  if(state.playing) return state._clockOffset+(performance.now()-state._t0)/1000;
  return state.playhead;
}
function syncClock(){

    const c=a.clip;

      const el=mediaEls[c.mediaId];
      if(!state.playing){const srcT=(t-c.start)*c.speed+c.trimStart; try{el.currentTime=srcT;}catch(e){}}
    }

}
function tick(){

  state.playhead=t;updatePlayheadUI();
  // advance media elements
  for(const a of activeClipsAt(t)){
    const c=a.clip;
    if((c.kind==='video'||c.kind==='audio')&&mediaEls[c.mediaId]){
      const el=mediaEls[c.mediaId];
      const srcT=(t-c.start)*c.speed + c.trimStart;
      if(Math.abs(el.currentTime-srcT)>0.25){try{el.currentTime=srcT;}catch(e){}}
      if(el.paused) el.play().catch(()=>{});
      el.muted = state.muted;
      el.volume = (c.kind==='audio')? (state.muted?0:c.volume) : (state.muted?0:(c.volume??1));
    }

// canvas render loop (independent), always draws current frame
let lastFrameT=-1;
function rafLoop(){

function sampleCenterColor(c){

    const nh=imgEl.videoHeight||imgEl.naturalHeight||720;

function renderFrame(t){

  const acts=activeClipsAt(t).sort((a,b)=>{

const imgCache={};
function hexToRgb(hex){

  if(h.length===3) return [parseInt(h[0]+h[0],16),parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16)];
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];

// Shared draw core — used by BOTH live preview and export (so chroma key, filters,

function drawClipTo(c, localT, g){
  const f=Filters[c.filter]?Filters[c.filter].css:'';

    const m=mediaById(c.mediaId);
    if(!m) return;
    let imgEl;
    if(c.kind==='video'){ imgEl=g.videoEls[c.mediaId]; if(!imgEl) imgEl=mediaEls[c.mediaId]||getMediaEl(m); }
    else { imgEl=g.imageCache[c.mediaId]; if(!imgEl){imgEl=new Image();imgEl.src=m.url;g.imageCache[c.mediaId]=imgEl;} }
    if(!imgEl) return;

    if(c.kind==='image'&&!(imgEl.complete&&imgEl.naturalWidth)) return;
    const nw=imgEl.videoWidth||imgEl.naturalWidth||m.w||1280;
    const nh=imgEl.videoHeight||imgEl.naturalHeight||m.h||720;
    if(c.chroma&&c.chroma.on){ drawChroma(g,imgEl,nw,nh,c,f); return; }
    const CT=g.ctx;

const chromaBuf=document.createElement('canvas');

  CT.globalAlpha=c.opacity??1;
  CT.translate(g.W/2,g.H/2); CT.rotate((c.rotate||0)*Math.PI/180); CT.scale(c.scale,c.scale); CT.translate(-g.W/2,-g.H/2);
  CT.drawImage(buf,dx,dy,dw,dh);
  CT.restore();
}
function drawFitTo(CT,img,nw,nh,W,H,fit){
  if(fit==='contain'){const r=Math.min(W/nw,H/nh);const w=nw*r,h=nh*r;CT.drawImage(img,(W-w)/2,(H-h)/2,w,h);}
  else if(fit==='stretch'){CT.drawImage(img,0,0,W,H);}
  else {const r=Math.max(W/nw,H/nh);const w=nw*r,h=nh*r;CT.drawImage(img,(W-w)/2,(H-h)/2,w,h);}
}
function drawTextTo(g,c,localT){
  const st=c.textStyle; if(!st) return;
  const CT=g.ctx; let alpha=1, scale=1, xoff=0;
  const an=Animations[c.anim];
  if(an&&an.fn){alpha=clamp(an.fn(localT,c.dur),0,1); if(c.anim==='pop')scale=an.fn(localT,c.dur); if(c.anim==='slide')xoff=(1-an.fn(localT,c.dur))*g.W*0.4;}
  CT.save();
  CT.globalAlpha=alpha;
  CT.font=st.font; CT.textAlign=st.align||'center'; CT.textBaseline='middle';
  const lines=String(c.text).split('\n'); const fs=parseInt(st.font.match(/(\d+)px/)[1])||48; const lh=fs*1.15;
  CT.translate(g.W/2+xoff+(c.x||0),g.H/2+(c.y||0)); CT.scale(scale,scale);
  let y=-(lines.length-1)*lh/2;
  for(const line of lines){
    if(st.shadow){CT.shadowColor='rgba(0,0,0,.6)';CT.shadowBlur=st.shadow;CT.shadowOffsetY=st.shadow/2;}
    if(st.strokeW>0){CT.lineWidth=st.strokeW;CT.strokeStyle=st.stroke;CT.strokeText(line,0,y);}
    if(st.bg&&st.bg!=='rgba(0,0,0,0)'){const tw=CT.measureText(line).width;CT.fillStyle=st.bg;CT.fillRect(-tw/2-st.padding,y-lh/2-st.padding,tw+st.padding*2,lh+st.padding*2);}
    CT.fillStyle=st.color;CT.fillText(line,0,y);y+=lh;
  }
  CT.restore();
}
function yoff(c){return (c.y||0);}

function rgbToHex(rgba){
  if(rgba&&rgba.startsWith('#')) return rgba;
  const m=rgba&&rgba.match(/(\d+),\s*(\d+),\s*(\d+)/);
  if(m) return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('');
  return '#000000';
}
function hexToRgba(hex,a){
  const m=hex.replace('#','');const r=parseInt(m.substr(0,2),16),g=parseInt(m.substr(2,2),16),b=parseInt(m.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+(a||1)+')';
}

/* ---------- EXPORT (WebM via MediaRecorder + canvas + web audio) ---------- */
const exportModal=document.getElementById('exportModal');
document.getElementById('btnExport').onclick=()=>exportModal.classList.remove('hidden');
document.getElementById('expCancel').onclick=()=>exportModal.classList.add('hidden');
document.getElementById('expStart').onclick=startExport;

async function startExport(){
  pause();
  const [W,H]=document.getElementById('expRes').value.split('x').map(Number);
  const fps=+document.getElementById('expFps').value;
  const q=+document.getElementById('expQ').value;
  const dur=totalDuration();
  if(dur<0.2){toast('Nothing to export');return;}
  exportModal.classList.add('hidden');
  // staging canvas
  const sc=document.createElement('canvas');sc.width=W;sc.height=H;
  const scx=sc.getContext('2d');
  // Build audio graph if there are audio clips
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  let audioCtx=null, destNode=null, audioSources=[];
  const hasAudio=state.tracks.some(t=>(t.kind==='audio'||t.kind==='tts')&&t.clips.length);
  if(hasAudio&&AudioCtx){
    audioCtx=new AudioCtx();
    destNode=audioCtx.createMediaStreamDestination();
  }
  const stream=sc.captureStream(fps);
  if(destNode) destNode.stream.getAudioTracks().forEach(t=>stream.addTrack(t));

  const chunks=[];
  const mime = pickMime();
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.max(500000,2000000-(q-1)*40000)});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const done=new Promise(res=>rec.onstop=res);

  // prepare video/audio elements for export (separate from preview to avoid contention)
  const expEls={};
  for(const tr of state.tracks) for(const c of tr.clips){
    if((c.kind==='video'||c.kind==='audio')&&c.mediaId){
      const m=mediaById(c.mediaId); if(!m) continue;
      if(!expEls[c.mediaId]){
        const el=c.kind==='video'?document.createElement('video'):document.createElement('audio');
        el.src=m.url;el.crossOrigin='anonymous';el.muted=false;await new Promise(r=>{el.oncanplaythrough=()=>r();el.onerror=()=>r();el.load();setTimeout(r,3000);});
        expEls[c.mediaId]=el;
        if(audioCtx&&destNode){
          try{const s=audioCtx.createMediaElementSource(el);s.connect(destNode);s.connect(audioCtx.destination);}catch(e){}
        }
      }
    }
  }
  // pre-synthesize TTS voiceover clip audio (offline meSpeak) into AudioBuffers
  const ttsBuffers={};
  if(audioCtx){
    for(const tr of state.tracks) for(const c of tr.clips){
      if(tr.kind==='tts'&&c.text&&c.wav&&!ttsBuffers[c.id]){
        try{
          const ab=base64WavToAudioBuffer(audioCtx, c.wav);
          if(ab) ttsBuffers[c.id]=ab;
        }catch(e){ console.warn('TTS export decode failed', e); }
      }
    }
  }
  const ttsNodes={}; // id -> {src, started}
  // intercept drawClip to use export canvas
  const drawExports=async()=>{
    let t=0;
    rec.start();
    if(audioCtx) audioCtx.resume();
    const start=performance.now();
    function frame(){
      const elapsed=(performance.now()-start)/1000;
      t=Math.min(dur,elapsed);
      // media elements (video/audio)
      for(const tr of state.tracks) for(const c of tr.clips){
        if((c.kind==='video'||c.kind==='audio')&&expEls[c.mediaId]){
          const el=expEls[c.mediaId];
          if(t>=c.start&&t<c.start+effDur(c)){
            const srcT=(t-c.start)*c.speed+c.trimStart;
            if(Math.abs(el.currentTime-srcT)>0.2){try{el.currentTime=srcT;}catch(e){}}
            if(el.paused) el.play().catch(()=>{});
            el.volume=(c.kind==='audio')?(state.muted?0:c.volume):(state.muted?0:(c.volume??1));
          } else if(!el.paused){el.pause();}
        } else if(tr.kind==='tts'&&audioCtx&&ttsBuffers[c.id]){
          // schedule the TTS audio buffer once when its window begins
          if(t>=c.start && t<c.start+effDur(c)){
            const node=ttsNodes[c.id];
            if(!node||!node.started){
              const src=audioCtx.createBufferSource(); src.buffer=ttsBuffers[c.id];
              const g=audioCtx.createGain(); g.gain.value=state.muted?0:(c.volume??1);
              src.connect(g); g.connect(destNode); g.connect(audioCtx.destination);
              src.start(audioCtx.currentTime, (t-c.start)*c.speed);
              ttsNodes[c.id]={src,started:true};
            }
          }
        }
      }
      renderExportFrame(scx,sc,W,H,t,expEls,imgCache);
      const pct=Math.min(100,t/dur*100);
      const ef=document.getElementById('expFill'); if(ef) ef.style.width=pct+'%';
      if(t<dur){ setTimeout(frame, 1000/fps); } // cadence-based: works even when tab is backgrounded
      else{
        rec.stop();
        for(const id in expEls){try{expEls[id].pause();}catch(e){}}
        for(const id in ttsNodes){try{ttsNodes[id].src.stop();}catch(e){}}
        if(audioCtx) audioCtx.close();
      }
    }
    frame();
  };
  // show progress bar (reuse export modal as a live bar)
  exportModal.classList.remove('hidden');
  document.querySelector('#exportModal .box').innerHTML='<h3>Rendering… '+W+'×'+H+' @'+fps+'fps</h3><div class="bar"><div class="fill" id="expFill"></div></div><div class="time" id="expPct" style="margin-top:8px">0%</div>';
  drawExports();
  await done;
  const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(state.projectName||'capcut-pro')+'.webm';a.click();
  exportModal.classList.add('hidden');
  toast('Export ready ('+(blob.size/1048576).toFixed(1)+' MB)');
}
function pickMime(){
  const cs=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const c of cs) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c)) return c;
  return 'video/webm';
}
// export-aware render: reuses the SAME draw core as the preview.
function renderExportFrame(c2,W,H,t,expEls,imageCache){
  c2.clearRect(0,0,W,H);c2.fillStyle='#000';c2.fillRect(0,0,W,H);
  const acts=activeClipsAt(t).sort((a,b)=>{const o={image:0,video:1,text:2,audio:3};return o[a.clip.kind]-o[b.clip.kind];});
  for(const a of acts){ drawClipTo(a.clip, t-a.clip.start, {ctx:c2, W, H, videoEls:expEls, imageCache:imageCache||imgCache}); }
}

/* ---------- TOAST ---------- */
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}

/* ---------- INIT ---------- */
renderBin();renderTimeline();renderProps();
// draw initial frame
renderFrame(0);
// expose pure logic for node harness
if(typeof module!=='undefined'){module.exports={clamp,effDur,fmt,Filters,Animations,snapVal,allSnapPoints,state};}
</script>
